<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="no-referrer" />
    <title>LighteningSend</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>%E2%9A%A1</text></svg>" />
  </head>

  <body>
    <header>
      <h1>Lightening<span>Send</span></h1>
      <nav role="tablist" aria-label="Mode">
        <button id="tab-send" role="tab" aria-controls="panel-send" aria-selected="true">Send</button>
        <button id="tab-recv" role="tab" aria-controls="panel-recv" aria-selected="false">Receive</button>
      </nav>
    </header>

    <main>
      <!-- ---------------------------------------------------------- SEND -->
      <section id="panel-send" role="tabpanel" aria-labelledby="tab-send">
        <div class="controls">
          <label class="file">
            <input type="file" id="file-input" />
            <span id="file-label">Choose a file…</span>
          </label>

          <div class="knobs">
            <label>
              QR density
              <select id="chunk-size">
                <option value="384">Low &middot; 384 B</option>
                <option value="768" selected>Medium &middot; 768 B</option>
                <option value="1280">High &middot; 1280 B</option>
                <option value="2048">Max &middot; 2048 B</option>
              </select>
            </label>
            <label>
              Speed <output id="fps-out">8</output> fps
              <input type="range" id="fps" min="1" max="20" step="1" value="8" />
            </label>
          </div>

          <button id="send-btn" class="primary" disabled>Start transfer</button>
        </div>

        <p id="send-status" class="status" role="status">Pick a file to get started.</p>
        <canvas id="qr" width="512" height="512" aria-label="QR code frame"></canvas>
      </section>

      <!-- ------------------------------------------------------- RECEIVE -->
      <section id="panel-recv" role="tabpanel" aria-labelledby="tab-recv" hidden>
        <div class="controls">
          <button id="recv-btn" class="primary">Start camera</button>
        </div>

        <p id="recv-status" class="status" role="status">Point this camera at the sender's screen.</p>
        <div class="progress"><div id="recv-bar"></div></div>
        <canvas id="recv-map" class="map" width="1" height="1" aria-label="Received chunk map"></canvas>
        <video id="video" muted autoplay playsinline></video>
      </section>
    </main>

    <footer>
      No network. No upload. Everything stays in the two browsers.
      <a href="https://github.com/intelQong/LighteningSend">source</a>
    </footer>

    <script src="vendor/qrcode.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
