<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Camera simulation</title>
  </head>
  <body>
    <pre id="out" style="font: 13px monospace"></pre>
    <script src="vendor/qrcode.js"></script>
    <script type="module">
      import { buildData } from "./app.js";
      import { scanRGBABuffer } from "./vendor/zbar.mjs";

      const out = document.getElementById("out");
      const log = (l) => (out.textContent += l + "\n");

      function bytesToLatin1(b) {
        let s = "";
        for (let i = 0; i < b.length; i += 4096) s += String.fromCharCode.apply(null, b.subarray(i, i + 4096));
        return s;
      }

      // Render a frame the way the sender's canvas does.
      function renderQR(frame, ec, scale = 4, quiet = 4) {
        const qr = qrcode(0, ec);
        qr.addData(bytesToLatin1(frame), "Byte");
        qr.make();
        const n = qr.getModuleCount();
        const size = (n + quiet * 2) * scale;
        const c = new OffscreenCanvas(size, size);
        const x = c.getContext("2d");
        x.fillStyle = "#fff";
        x.fillRect(0, 0, size, size);
        x.fillStyle = "#000";
        for (let r = 0; r < n; r++)
          for (let col = 0; col < n; col++)
            if (qr.isDark(r, col)) x.fillRect((col + quiet) * scale, (r + quiet) * scale, scale, scale);
        return { canvas: c, version: (n - 17) / 4, modules: n + quiet * 2 };
      }

      // Simulate a phone camera: the QR occupies part of a 1080p frame, slightly
      // rotated, defocused, with sensor noise and screen glare.
      function simulateCamera(qrCanvas, { frameW, fill, blur, rotate, noise }) {
        const frameH = Math.round((frameW * 9) / 16);
        const c = new OffscreenCanvas(frameW, frameH);
        const x = c.getContext("2d");
        x.fillStyle = "#5a5f66";
        x.fillRect(0, 0, frameW, frameH);

        const target = frameH * fill;
        x.save();
        x.translate(frameW / 2, frameH / 2);
        x.rotate((rotate * Math.PI) / 180);
        x.filter = `blur(${blur}px)`;
        x.drawImage(qrCanvas, -target / 2, -target / 2, target, target);
        x.restore();

        const img = x.getImageData(0, 0, frameW, frameH);
        const d = img.data;
        if (noise) {
          for (let i = 0; i < d.length; i += 4) {
            const n = (Math.random() - 0.5) * noise;
            d[i] += n; d[i + 1] += n; d[i + 2] += n;
          }
        }
        return img;
      }

      // The receiver downsamples to 1600px before scanning.
      function receiverScale(img) {
        const s = Math.min(1, 1600 / Math.max(img.width, img.height));
        if (s === 1) return img;
        const sw = Math.round(img.width * s), sh = Math.round(img.height * s);
        const src = new OffscreenCanvas(img.width, img.height);
        src.getContext("2d").putImageData(img, 0, 0);
        const dst = new OffscreenCanvas(sw, sh);
        const dx = dst.getContext("2d");
        dx.drawImage(src, 0, 0, sw, sh);
        return dx.getImageData(0, 0, sw, sh);
      }

      const TRIALS = 8;
      const EC = "M";
      // Is there a chunk size that rescues a bad 720p, heavily blurred hold?
      const WORST = { frameW: 1280, fill: 0.4, blur: 2.5, rotate: 9, noise: 18 };
      const MID   = { frameW: 1280, fill: 0.55, blur: 1.8, rotate: 6, noise: 14 };
      log("small chunk sizes against a poor 720p camera\n");
      log("   bytes  ver   worst case    mediocre");
      for (const bytes of [64, 128, 192, 256, 384]) {
        const row = [];
        let version = 0;
        for (const cond of [WORST, MID]) {
          let ok = 0;
          for (let t = 0; t < TRIALS; t++) {
            const payload = new Uint8Array(bytes);
            for (let i = 0; i < bytes; i++) payload[i] = (i * 31 + t * 7) & 0xff;
            const frame = buildData(t, payload);
            const r = renderQR(frame, EC);
            version = r.version;
            const img = receiverScale(simulateCamera(r.canvas, cond));
            const syms = await scanRGBABuffer(img.data.buffer, img.width, img.height);
            if (syms.length) {
              const got = new Uint8Array(syms[0].data.buffer.slice(0));
              if (got.length === frame.length && got.every((b, i) => b === frame[i])) ok++;
            }
          }
          row.push(`${Math.round((ok / TRIALS) * 100)}%`.padStart(11));
        }
        log(`   ${String(bytes).padStart(5)}  v${String(version).padStart(2)}  ${row.join(" ")}`);
      }
      document.title = "done";
    </script>
  </body>
</html>
